<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate" />
<title>Login Page</title>
<!-- <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Tangerine">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Sofia">-->
<style>
@font-face {
    font-family: ChristmasFont;
    src: url(fonts/MountainsofChristmas-Regular.ttf);
}
body {
	background-color:Khaki;
}

label, input {
	font-size: 2em;
	font-family: 'ChristmasFont', serif;
	margin: 5px;
}

div#geral {
	position: absolute;
	top: 35%;
	left: 35%;
	height: auto;
	width: auto;
	border: 3px solid Brown;
	text-align: right;
	padding: 20px;
}
</style>
</head>
<body>
	<div id="geral">
		<form method="POST" action="LoginServlet">
			<label for="j_username">Utilizador: </label> <input type="text"
				name="j_username" id="j_username" required><br> <label
				for="j_password">Senha: </label> <input type="password"
				name="j_password" id="j_password" required><br> <input
				type="submit" value="Entrar!"> <input type="reset"
				value="Limpar">
		</form>
	</div>
</body>
</html>
